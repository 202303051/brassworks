name: Factory demo checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, format, business tests and coverage
        run: node scripts/check-phase-1.mjs
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Build web application
        run: npm run build
        env:
          VITE_APPER_SDK_CDN_URL: https://cdn.apper.io/v1/apper-sdk.v1.js
          VITE_APPER_PROJECT_ID: a267809592b04747a60b8bb33dd8399d

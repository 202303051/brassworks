name: Brassworks checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Browser scenarios
        timeout-minutes: 5
        shell: bash
        run: |
          browser_executable="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_executable" ]; then
            CHROMIUM_PATH="$browser_executable" node scripts/test-browser.mjs
          else
            npx playwright install --with-deps chromium
            node scripts/test-browser.mjs
          fi
      - run: npm run test:spectro
      - run: npm run test:auth

  database:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .tools/postgres-17.11-5
          key: postgres-windows-x64-17.11-5
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-database-local.ps1
      - run: node scripts/test-database.mjs
